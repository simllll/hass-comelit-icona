test_connection:
  name: Test connection
  description: >-
    Open a raw TCP connection to the ICONA bridge and return whether it
    succeeded. Use this to confirm the device is reachable on the port.
  fields:
    ip:
      name: IP address
      description: IP address of the Comelit device.
      required: true
      example: "192.168.1.100"
      selector:
        text:
    port:
      name: Port
      description: ICONA bridge TCP port.
      required: false
      default: 64100
      example: 64100
      selector:
        number:
          min: 1
          max: 65535
          mode: box

test_authenticate:
  name: Test authentication
  description: >-
    Connect and authenticate with a token, returning the auth response
    code (200 = success).
  fields:
    ip:
      name: IP address
      description: IP address of the Comelit device.
      required: true
      example: "192.168.1.100"
      selector:
        text:
    port:
      name: Port
      description: ICONA bridge TCP port.
      required: false
      default: 64100
      example: 64100
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    token:
      name: Token
      description: 32-character ICONA token.
      required: true
      example: "0123456789abcdef0123456789abcdef"
      selector:
        text:

test_get_config:
  name: Test get configuration
  description: >-
    Connect, authenticate and return the directory the bridge reports:
    doors, actuators, entrances and the raw user-parameter keys. Handy to
    see exactly what will become buttons (and what address book they live in).
  fields:
    ip:
      name: IP address
      description: IP address of the Comelit device.
      required: true
      example: "192.168.1.100"
      selector:
        text:
    port:
      name: Port
      description: ICONA bridge TCP port.
      required: false
      default: 64100
      example: 64100
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    token:
      name: Token
      description: 32-character ICONA token.
      required: true
      example: "0123456789abcdef0123456789abcdef"
      selector:
        text:

speak:
  name: Speak at the entrance
  description: >-
    Say a message (text-to-speech) or play an audio file on the entrance
    panel's speaker. Mode "call" opens a short call to the panel, plays the
    audio and hangs up; it never interrupts a ring, a call or a live view: it
    waits up to "Max wait" for the panel to be free, otherwise it gives up and
    logs why. Mode "answer" answers the incoming call Home Assistant holds
    after a ring at once and speaks on it as soon as the audio is ready (the
    monitor may then lose that call). With "Open the door" it opens the door
    afterwards: inside the answered ring's call in mode "answer", with the
    usual open command in mode "call"; it never opens otherwise. "Prepare only"
    builds and caches the audio without any call. Experimental. Returns the
    outcome (spoken, door, reason, timings).
  target:
    entity:
      integration: comelit_intercom
      domain: camera
  fields:
    mode:
      name: Mode
      description: >-
        "call": open a new call once the panel is free. "answer": answer the
        incoming call of the current ring and speak on it (test it first: the
        monitor may lose the call, e.g. not open the gate).
      default: "call"
      selector:
        select:
          options:
            - "call"
            - "answer"
    answer_fallback:
      name: Fall back to call
      description: >-
        With mode "answer" and no incoming call to answer: open a new call
        instead (on) or give up (off).
      default: true
      selector:
        boolean:
    open_door:
      name: Open the door
      description: >-
        After the message (or right after answering, with no message), open
        the door. Mode "answer": inside the answered call, waiting at most 2 s
        for the panel's ACK and call end, then hang up (a 6741W sends neither
        and opens anyway). Mode "call": the usual open command, as the lock
        does. Off by default: without it the door is never opened.
      default: false
      selector:
        boolean:
    door:
      name: Door
      description: >-
        Name of the door to open (as in the device's opendoor address book).
        Default: the only door on this entrance.
      example: "Main door"
      selector:
        text:
    prepare_only:
      name: Prepare only
      description: >-
        Only build the audio and keep it in memory (no call), so a later
        speak with the same message starts at once. For warm-up automations.
      default: false
      selector:
        boolean:
    message:
      name: Message
      description: >-
        Text to say. Give this or a media content ID (or neither, with "Open
        the door").
      example: "Welcome home!"
      selector:
        text:
          multiline: true
    media_content_id:
      name: Media content ID
      description: >-
        Ready-made audio instead of a message: a media-source ID (local media
        or TTS), an absolute path in an allowed folder (allowlist_external_dirs)
        or an http(s) URL listed in allowlist_external_urls.
      example: "media-source://media_source/local/welcome.mp3"
      selector:
        text:
    tts_entity:
      name: TTS engine
      description: >-
        Text-to-speech entity (or legacy engine name). Default: Home
        Assistant's default engine.
      example: "tts.google_ai_tts"
      selector:
        entity:
          domain: tts
    language:
      name: Language
      description: >-
        Language of the message. Default: Home Assistant's language. A short
        tag like "en" is matched to what the engine lists (e.g. "en-US").
      example: "en"
      selector:
        text:
    voice:
      name: Voice
      description: >-
        Engine voice. Default: the engine's own. A clear, firm voice carries
        best through the panel's small speaker (e.g. "kore" on Google AI,
        "nova" on OpenAI).
      example: "kore"
      selector:
        text:
    options:
      name: TTS options
      description: Extra options for the TTS engine.
      example: '{"voice": "aoede"}'
      selector:
        object:
    cache:
      name: Cache
      description: >-
        Reuse Home Assistant's TTS cache and the audio kept in memory for
        repeated messages. Off: render the message again.
      default: true
      selector:
        boolean:
    gain_db:
      name: Gain
      description: >-
        Extra gain in dB after normalising the audio to -1 dBFS (negative is
        quieter, positive may clip).
      default: 0
      selector:
        number:
          min: -20
          max: 12
          step: 1
          unit_of_measurement: dB
    max_wait:
      name: Max wait
      description: >-
        How long to wait for the entrance to be free (ringing, in a call,
        live view) before giving up.
      default: 60
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    audio_wait:
      advanced: true
      name: Audio wait
      description: >-
        Advanced: after the call is answered, how long to wait for the
        panel's own audio (proof the audio path is open) before playing
        anyway.
      default: 5
      selector:
        number:
          min: 0
          max: 60
          step: 0.5
          unit_of_measurement: s
    lead_in:
      advanced: true
      name: Lead-in
      description: "Advanced: silence sent before the message starts."
      default: 0.4
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
          unit_of_measurement: s
    transport:
      advanced: true
      name: Transport
      description: >-
        Advanced: how to send the audio to the panel. "auto": the same
        transport as the call's video (TCP or UDP), in both modes. A 6741W
        plays the voice only over TCP (over UDP its speaker switches on but
        stays silent); its video arrives over TCP, so "auto" picks TCP.
      default: "auto"
      selector:
        select:
          options:
            - "auto"
            - "tcp"
            - "udp"
